[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytauto"
version = "0.1.0"
description = "Faceless YouTube video automation"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.2",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[project.scripts]
ytauto = "ytauto.cli.__main__:main"

[project.entry-points."ytauto.stages"]
"story_video:ingest_story" = "ytauto.providers.story.pasted:make_stage"
"story_video:synthesize_speech" = "ytauto.providers.tts.edge:make_stage"
"story_video:transcribe" = "ytauto.providers.transcribe.edge_boundary:make_stage"
"story_video:plan_timeline" = "ytauto.app.stages.plan_timeline:make_stage"
"story_video:select_broll" = "ytauto.providers.visual.library:make_stage"
"story_video:compose_landscape" = "ytauto.app.stages.compose:make_compose_landscape"
"story_video:compose_vertical" = "ytauto.app.stages.compose:make_compose_vertical"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests shell out to a real ffmpeg and nvidia-smi, so they are
# excluded by default: the unit suite must stay hermetic and runnable anywhere.
# scripts/check.ps1 runs them as a separate, explicitly gated step.
addopts = "-q --strict-markers -m 'not integration'"
markers = ["integration: requires real external binaries"]
# A leaked pipe or file handle is a real defect here: the dispatcher spawns
# worker subprocesses, and Popen does not close its pipe objects when the child
# exits. That leak shipped once already and the gate did not notice.
#
# BOTH entries are required, and this was verified rather than assumed. The leak
# surfaces when the garbage collector finalises the pipe, which makes it an
# *unraisable* exception - pytest wraps that in PytestUnraisableExceptionWarning,
# a class that is not a ResourceWarning, so promoting ResourceWarning alone
# catches nothing. Measured against a deliberately reintroduced leak:
# error::ResourceWarning alone -> suite still passes; adding the unraisable
# entry -> the suite fails. A gate that does not gate is this project's oldest
# recurring bug; do not drop either line without re-running that check.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# RUF100 flags noqa codes that suppress nothing. Without it, a `# noqa: S603`
# for a rule that is not even selected looks like an active lint and isn't.
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF100"]

[tool.mypy]
python_version = "3.12"
packages = ["ytauto"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "ytauto.core.*"
strict = true

[tool.importlinter]
root_package = "ytauto"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is pure - depends on nothing internal"
type = "forbidden"
source_modules = ["ytauto.core"]
forbidden_modules = [
    "ytauto.infra",
    "ytauto.app",
    "ytauto.providers",
    "ytauto.ui",
    "ytauto.cli",
]

[[tool.importlinter.contracts]]
name = "engine never imports Qt"
type = "forbidden"
source_modules = [
    "ytauto.core",
    "ytauto.app",
    "ytauto.providers",
    "ytauto.infra",
    "ytauto.cli",
]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = ["ytauto.ui", "ytauto.app", "ytauto.core"]

[[tool.importlinter.contracts]]
name = "app depends only on core and infra"
type = "forbidden"
source_modules = ["ytauto.app"]
forbidden_modules = ["ytauto.providers", "ytauto.ui", "ytauto.cli"]
